# CEC schedule config
# device: logical address (0 is typically TV) or a target as expected by cec-client
# cec_client_path: optional absolute path to cec-client binary

device: 0
cec_client_path: /usr/bin/cec-client

# Default delay between multiple commands in a single schedule item (seconds).
# Can be overridden per-item with 'command_delay'.
command_delay: 5.0

# Re-send each command this many extra times, 'retry_delay' seconds apart.
# A TV in deep standby often ignores the first 'on'; a later attempt powers it.
# Overridable per-item with 'retries' / 'retry_delay'.
retries: 0
retry_delay: 10.0

# Before each job, query the TV's CEC power state. If it doesn't answer, the TV
# has powered down its CEC controller (deep sleep / eco standby) and is offline:
# the job is skipped and an error is logged. Set false to send commands anyway.
# NOTE: also disable the TV's deep sleep / eco standby settings (see README).
power_check: true

commands:
  - name: "Weekday TV on"
    time: "14:00"
    commands: ["on 0", "as"]
    days: [mon,tue,wed,thu,fri]
    retries: 2
    retry_delay: 10.0

  - name: "Weekend TV on"
    time: "8:00"
    commands: ["on 0", "as"]
    days: [sat,sun]
    retries: 2
    retry_delay: 10.0

  - name: "Turn TV off for night"
    time: "21:00"
    commands: ["standby 0"]
